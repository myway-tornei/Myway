<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyWay Tornei</title>
<style>
:root{--bg:#fffaf0;--fg:#1f2937;--card:#fff;--line:#e5e7eb;--acc:#f59e0b;--acc2:#0ea5e9;--mut:#6b7280;--red:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--line:#374151;--mut:#9ca3af}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;box-sizing:border-box;padding:10px;min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{margin-top:14px;padding:12px 18px;min-height:44px;border:0;border-radius:8px;background:var(--acc);color:#111;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;border:1px solid var(--line);color:var(--fg)}
button.del{background:transparent;border:1px solid var(--red);color:var(--red);margin:0;min-height:36px;padding:6px 12px;font-size:.85rem}
button:disabled{opacity:.6}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.tag{font-size:.75rem;background:var(--acc2);color:#fff;border-radius:99px;padding:2px 8px;white-space:nowrap}
.cnt{font-weight:700;color:var(--acc)}
.msg{color:var(--mut);font-size:.9rem;margin-top:10px}
.err{color:var(--red)}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
<h1>🏐 MyWay Tornei</h1>
<p class="sub">Tornei di beach volley: scegli il torneo, iscrivi la tua squadra e guarda chi è già dentro.</p>

<div class="card">
  <label for="tour" style="margin-top:0">Torneo</label>
  <select id="tour"></select>
  <div class="msg" id="tinfo"></div>
</div>

<div class="card" id="formCard" hidden>
  <strong>Iscrivi la tua squadra</strong>
  <label for="team">Nome squadra</label><input id="team" maxlength="40" autocomplete="off">
  <label for="p1">Giocatore/giocatrice 1</label><input id="p1" maxlength="40" autocomplete="off">
  <label for="p2">Giocatore/giocatrice 2</label><input id="p2" maxlength="40" autocomplete="off">
  <label for="cat">Categoria</label>
  <select id="cat"><option>Maschile</option><option>Femminile</option><option>Misto</option></select>
  <input id="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button id="save">Iscriviti</button>
  <div class="msg" id="msg"></div>
  <div class="msg"><strong>⚠️ Attenzione:</strong> l'iscrizione si può annullare solo fino a 24 ore prima dell'inizio del torneo.</div>
</div>

<div class="card" id="listCard" hidden>
  <strong>Squadre iscritte: <span class="cnt" id="n">0</span></strong>
  <div id="list"></div>
</div>

<div class="card" id="adminCard" hidden>
  <strong>Area organizzatore</strong><div id="adminBox"></div>
</div>
<div style="text-align:center"><button id="adminLink" type="button" style="background:none;border:0;color:var(--mut);font-size:.8rem;text-decoration:underline;min-height:0;margin:0;padding:8px;font-weight:400">Accesso organizzatore</button></div>
</main>
<script>
const SB_URL = "https://uhjntqurkwlxzhiefkhl.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoam50cXVya3dseHpoaWVma2hsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTg3OTIsImV4cCI6MjEwNjc3NDc5Mn0.6vBo-QMOfY8AdZdNSANdZoCT3fo8PzZ5J1lMJBoTpLQ";

const $ = id => document.getElementById(id);
const S = {tours: [], regs: [], cur: null, auth: null, open: false};
try{ S.auth = JSON.parse(sessionStorage.getItem("mw_auth") || "null"); }catch(e){}
const mine = () => { try{ return JSON.parse(localStorage.getItem("mw_mine") || "{}"); }catch(e){ return {}; } };
const saveMine = o => { try{ localStorage.setItem("mw_mine", JSON.stringify(o)); }catch(e){} };

const fmtDate = s => s ? new Date(s).toLocaleString("it-IT", {weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit"}) : "";
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
function msg(id, t, err){ const m = $(id); m.textContent = t || ""; m.className = "msg" + (err ? " err" : ""); }

async function api(path, opt = {}){
  const headers = {apikey: SB_KEY, Authorization: "Bearer " + (S.auth ? S.auth.token : SB_KEY), "Content-Type": "application/json", ...(opt.headers || {})};
  const r = await fetch(SB_URL + "/rest/v1/" + path, {...opt, headers});
  if(r.status === 401 && S.auth){ logout(); }
  return r;
}

async function loadTours(){
  try{
    const r = await api("tournaments?select=id,name,starts_at,place&order=created_at.asc");
    if(!r.ok) throw 0;
    S.tours = await r.json();
  }catch(e){ S.tours = []; $("tinfo").textContent = "Elenco tornei non disponibile al momento."; $("tinfo").className = "msg err"; }
  const sel = $("tour"); sel.textContent = "";
  if(!S.tours.length){
    sel.appendChild(new Option("Nessun torneo disponibile", ""));
    S.cur = null; $("formCard").hidden = true; $("listCard").hidden = true;
    if(!$("tinfo").textContent) $("tinfo").textContent = "Torna a trovarci: il prossimo torneo sarà pubblicato presto.";
    renderAdmin(); return;
  }
  S.tours.forEach(t => sel.appendChild(new Option(t.name, t.id)));
  const fromHash = (location.hash.match(/t=([0-9a-f-]+)/) || [])[1];
  const keep = S.cur && S.tours.find(t => t.id === S.cur) ? S.cur : null;
  S.cur = keep || (S.tours.find(t => t.id === fromHash) || S.tours[0]).id;
  sel.value = S.cur;
  await selectTour();
}

async function selectTour(){
  const t = S.tours.find(x => x.id === S.cur); if(!t) return;
  history.replaceState(null, "", "#t=" + t.id);
  $("tinfo").className = "msg";
  $("tinfo").textContent = [fmtDate(t.starts_at), t.place].filter(Boolean).join(" · ");
  $("formCard").hidden = false; $("listCard").hidden = false;
  msg("msg", "");
  await loadRegs(); renderAdmin();
}

async function loadRegs(){
  const box = $("list");
  try{
    const r = await api("registrations?select=id,team,p1,p2,cat&tournament_id=eq." + S.cur + "&order=created_at.asc");
    if(!r.ok) throw 0;
    S.regs = await r.json();
  }catch(e){ box.textContent = ""; box.appendChild(el("div", "msg err", "Elenco non disponibile al momento.")); return; }
  $("n").textContent = S.regs.length;
  box.textContent = "";
  if(!S.regs.length){ box.appendChild(el("div", "msg", "Ancora nessuna iscrizione.")); return; }
  const m = mine();
  S.regs.forEach(it => {
    const row = el("div", "row");
    const l = el("div");
    l.append(el("strong", "", it.team));
    const s = el("div", "msg", [it.p1, it.p2].filter(Boolean).join(" · ")); s.style.margin = "0";
    l.append(s);
    const right = el("div"); right.style.cssText = "display:flex;gap:8px;align-items:center";
    right.append(el("span", "tag", it.cat));
    if(m[it.id]){
      const b = el("button", "del", "Annulla iscrizione");
      b.onclick = () => cancelMine(it.id, m[it.id], it.team);
      right.append(b);
    } else if(S.auth){
      const b = el("button", "del", "Rimuovi");
      b.onclick = () => ownerRemove(it.id, it.team);
      right.append(b);
    }
    row.append(l, right); box.appendChild(row);
  });
}

$("tour").addEventListener("change", e => { S.cur = e.target.value; selectTour(); });

$("save").addEventListener("click", async () => {
  if($("website").value) return;
  const team = $("team").value.trim(), p1 = $("p1").value.trim(), p2 = $("p2").value.trim();
  if(!S.cur){ msg("msg", "Scegli prima un torneo.", true); return; }
  if(!team || !p1 || !p2){ msg("msg", "Compila nome squadra e i due giocatori.", true); return; }
  const tr = S.tours.find(x => x.id === S.cur);
  const late = tr && new Date(tr.starts_at) - Date.now() < 24 * 3600 * 1000;
  const warn = late
    ? "⚠️ Attenzione: mancano meno di 24 ore all'inizio del torneo, quindi l'iscrizione NON potrà più essere annullata.\n\nVuoi iscriverti lo stesso?"
    : "⚠️ Attenzione: l'iscrizione potrà essere annullata solo fino a 24 ore prima dell'inizio del torneo (" + fmtDate(tr && tr.starts_at) + "). Dopo non sarà più possibile.\n\nVuoi procedere?";
  if(!confirm(warn)) return;
  $("save").disabled = true; msg("msg", "Invio in corso…");
  const id = crypto.randomUUID(), token = crypto.randomUUID();
  try{
    const r = await api("registrations", {method: "POST", headers: {Prefer: "return=minimal"},
      body: JSON.stringify({id, tournament_id: S.cur, team, p1, p2, cat: $("cat").value, delete_token: token})});
    if(r.status === 409){ msg("msg", "In questo torneo esiste già una squadra con questo nome.", true); return; }
    if(!r.ok) throw 0;
    const m = mine(); m[id] = token; saveMine(m);
    ["team", "p1", "p2"].forEach(i => $(i).value = "");
    msg("msg", "Iscrizione ricevuta ✓ " + (late ? "Non potrà più essere annullata." : "Puoi annullarla con \"Annulla iscrizione\" da questo dispositivo, fino a 24 ore prima dell'inizio del torneo."));
    loadRegs();
  }catch(e){ msg("msg", "Non è stato possibile iscriversi. Riprova tra poco.", true); }
  finally{ $("save").disabled = false; }
});

const TOO_LATE = "⚠️ Mancano meno di 24 ore all'inizio del torneo: l'iscrizione non può più essere annullata. Per un imprevisto contatta l'organizzatore.";
async function cancelMine(id, token, team){
  const tr = S.tours.find(x => x.id === S.cur);
  if(tr && new Date(tr.starts_at) - Date.now() < 24 * 3600 * 1000){ msg("msg", TOO_LATE, true); alert(TOO_LATE); return; }
  if(!confirm("Annullare l'iscrizione di \"" + team + "\"?")) return;
  try{
    const r = await api("rpc/delete_registration", {method: "POST", body: JSON.stringify({p_id: id, p_token: token})});
    if(!r.ok) throw 0;
    const res = await r.json();
    if(res === "too_late"){ msg("msg", TOO_LATE, true); alert(TOO_LATE); return; }
    const m = mine(); delete m[id]; saveMine(m);
    msg("msg", res === "ok" ? "Iscrizione annullata." : "L'iscrizione non esisteva più.");
    loadRegs();
  }catch(e){ msg("msg", "Impossibile annullare ora. Riprova.", true); }
}

async function ownerRemove(id, team){
  if(!confirm("Rimuovere la squadra \"" + team + "\"?")) return;
  const r = await api("registrations?id=eq." + id, {method: "DELETE", headers: {Prefer: "return=minimal"}});
  if(r.ok) loadRegs(); else msg("msg", "Rimozione non riuscita.", true);
}

/* ---------- Area organizzatore ---------- */
function logout(){ S.auth = null; try{ sessionStorage.removeItem("mw_auth"); }catch(e){} renderAdmin(); if(S.cur) loadRegs(); }

async function login(){
  const user = $("auser").value.trim().toLowerCase(), password = $("apass").value;
  if(!user || !password){ msg("amsg", "Inserisci username e password.", true); return; }
  if(!/^[a-z0-9._-]+$/.test(user)){ msg("amsg", "Username non valido: usa solo lettere, numeri, punto, trattino.", true); return; }
  const email = user + "@myway.invalid";
  msg("amsg", "Accesso in corso…");
  try{
    const r = await fetch(SB_URL + "/auth/v1/token?grant_type=password", {method: "POST", headers: {apikey: SB_KEY, "Content-Type": "application/json"}, body: JSON.stringify({email, password})});
    if(!r.ok){ msg("amsg", "Username o password non corretti.", true); return; }
    const j = await r.json();
    S.auth = {token: j.access_token, user};
    try{ sessionStorage.setItem("mw_auth", JSON.stringify(S.auth)); }catch(e){}
    renderAdmin(); if(S.cur) loadRegs();
  }catch(e){ msg("amsg", "Accesso non riuscito. Riprova.", true); }
}

async function addTour(){
  const name = $("tname").value.trim(), when = $("tdate").value, place = $("tplace").value.trim();
  if(!name || !when){ msg("amsg", "Inserisci nome, data e ora di inizio del torneo.", true); return; }
  const r = await api("tournaments", {method: "POST", headers: {Prefer: "return=minimal"}, body: JSON.stringify({name, starts_at: new Date(when).toISOString(), place: place || null})});
  if(!r.ok){ msg("amsg", "Non riesco ad aggiungere il torneo (permessi o sessione scaduta).", true); return; }
  ["tname", "tdate", "tplace"].forEach(i => $(i).value = "");
  msg("amsg", "Torneo aggiunto ✓");
  S.cur = null; loadTours();
}

async function delTour(t){
  if(!confirm("Eliminare il torneo \"" + t.name + "\" e TUTTE le sue iscrizioni?")) return;
  const r = await api("tournaments?id=eq." + t.id, {method: "DELETE", headers: {Prefer: "return=minimal"}});
  if(!r.ok){ msg("amsg", "Eliminazione non riuscita.", true); return; }
  S.cur = null; loadTours();
}

function renderAdmin(){
  $("adminCard").hidden = !(S.auth || S.open || /[?&]admin\b/.test(location.search));
  $("adminLink").hidden = !!S.auth;
  const box = $("adminBox"); box.textContent = "";
  const add = (t, tag = "div", cls) => { const e = el(tag, cls, t); box.appendChild(e); return e; };
  const field = (id, label, type = "text") => { add(label, "label"); const i = el("input"); i.id = id; i.type = type; i.autocomplete = "off"; box.appendChild(i); };
  if(!S.auth){
    field("auser", "Username"); field("apass", "Password", "password");
    const b = add("Accedi", "button"); b.onclick = login;
  } else {
    add("Accesso come " + S.auth.user, "div", "msg");
    add("Nuovo torneo", "strong").style.display = "block";
    field("tname", "Nome del torneo"); field("tdate", "Data e ora di inizio", "datetime-local"); field("tplace", "Luogo (facoltativo)");
    const b = add("Aggiungi torneo", "button"); b.onclick = addTour;
    if(S.tours.length){
      const h = add("Tornei esistenti", "strong"); h.style.cssText = "display:block;margin-top:18px";
      S.tours.forEach(t => {
        const row = el("div", "row"); row.append(el("span", "", t.name + " · " + fmtDate(t.starts_at)));
        const d = el("button", "del", "Elimina"); d.onclick = () => delTour(t); row.append(d); box.appendChild(row);
      });
    }
    const out = add("Esci", "button", "sec"); out.onclick = logout;
  }
  add("", "div", "msg").id = "amsg";
}

$("adminLink").addEventListener("click", () => { S.open = !S.open; renderAdmin(); });
renderAdmin();
loadTours();
setInterval(() => { if(S.cur) loadRegs(); }, 30000);
</script>
</body>
</html>
